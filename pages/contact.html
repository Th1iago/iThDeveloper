<!DOCTYPE html>
<html lang="es">

<head>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacto IsaDeveloper - Solicita presupuesto o consulta gratis para tu proyecto web. Desarrollador frontend especializado en soluciones personalizadas.">
    <meta name="keywords" content="contacto desarrollador, solicitar presupuesto, consulta gratis, contratar desarrollador web, desarrollo personalizado">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="icon" href="../img/logoPagina.png" type="image/png">
    <title>Contacto - IsaDeveloper | Solicita tu Presupuesto</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-md">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <img class="logo" src="../img/logoPagina.png" alt="Logo IsaDeveloper - Desarrollador Web">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto text-center">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Start</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page"
                                href="contact.html">Contact</a></li>
                        <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <h1>Contacto</h1>
            <!-- Formulario de contacto -->
            <div class="form-container">
                <form class="form">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu@email.com" required="">
                    </div>
                    <div class="form-group">
                        <label for="textarea">¿Cómo podemos ayudarte?</label>
                        <textarea name="textarea" id="textarea" rows="10" cols="50" placeholder="Cuéntanos sobre tu proyecto..." required=""></textarea>
                    </div>
                    <button class="form-submit-btn" type="submit">Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 IsaDeveloper. Todos los derechos reservados.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 700,
            once: true
        });
    </script>
</body>

</html>
